<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Broadcaster | Mission Control</title>
    <style>
        :root {
            --bg: #0a0a0c; --surface: #131316; --accent: #ff2a5f;
            --text: #e0e0e0; --text-dim: #888; --border: #2a2a35; --success: #00e676;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        h1 { margin: 0; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; }
        h1 span { color: var(--accent); }
        .status-badge { padding: 6px 12px; border-radius: 4px; background: rgba(0, 230, 118, 0.1); color: var(--success); border: 1px solid var(--success); font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .status-badge.offline { background: rgba(255, 42, 95, 0.1); color: var(--accent); border-color: var(--accent); }
        .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.5; } }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
        .panel h2 { margin-top: 0; font-size: 18px; color: var(--text-dim); border-bottom: 1px solid var(--border); padding-bottom: 10px;}
        table { width: 100%; border-collapse: collapse; margin-top: 15px;}
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); }
        th { color: var(--text-dim); font-weight: normal; font-size: 14px; }
        .empty-state { text-align: center; color: var(--text-dim); padding: 40px 0; font-style: italic; }
        #login-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: var(--surface); padding: 30px; border-radius: 8px; border: 1px solid var(--border); text-align: center; width: 300px; }
        .login-box input { width: 100%; padding: 10px; margin: 15px 0; box-sizing: border-box; background: var(--bg); border: 1px solid var(--border); color: white; }
        .login-box button { background: var(--accent); color: white; border: none; padding: 10px 20px; cursor: pointer; width: 100%; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div class="login-box">
            <h2 style="margin-top:0">Acesso Restrito</h2>
            <input type="password" id="pass-input" placeholder="Senha do Sistema">
            <button onclick="login()">Desbloquear</button>
            <p style="font-size:12px; color:var(--text-dim)">Default: darktrap247</p>
        </div>
    </div>
    <header>
        <h1>Mission <span>Control</span></h1>
        <div class="status-badge" id="api-status"><div class="pulse"></div> Conectando ao Cerebro...</div>
    </header>
    <div class="grid">
        <div class="panel">
            <h2>📦 O Galpão (HF Conta 2)</h2>
            <p style="font-size: 12px; color: var(--text-dim);">Videos em armazenamento seguro.</p>
            <table><thead><tr><th>Arquivo</th><th>Tamanho</th></tr></thead><tbody id="galpao-list"><tr><td colspan="2" class="empty-state">Carregando...</td></tr></tbody></table>
        </div>
        <div class="panel">
            <h2>📡 A Prateleira (Oracle 2)</h2>
            <p style="font-size: 12px; color: var(--text-dim);">Espaço HD: <span id="oracle-space">--</span> / 200GB</p>
            <table><thead><tr><th>Arquivo Atual</th><th>Status</th></tr></thead><tbody id="oracle-list"><tr><td colspan="2" class="empty-state">Carregando...</td></tr></tbody></table>
        </div>
    </div>
    <script>
        const API_BASE = 'https://roxingo-apollo-edit-web.hf.space/api/broadcaster/admin';
        let authHeader = '';
        function login() {
            const pass = document.getElementById('pass-input').value || 'darktrap247';
            authHeader = 'Basic ' + btoa('admin:' + pass);
            document.getElementById('login-overlay').style.display = 'none';
            fetchData();
            setInterval(fetchData, 30000);
        }
        async function fetchData() {
            const statusBadge = document.getElementById('api-status');
            try {
                const resInv = await fetch(API_BASE + '/inventory', { headers: { 'Authorization': authHeader } });
                if (!resInv.ok) throw new Error('Falha na autenticação');
                const invData = await resInv.json();
                statusBadge.className = 'status-badge';
                statusBadge.innerHTML = '<div class="pulse"></div> Cérebro Online';
                const galpaoBody = document.getElementById('galpao-list');
                if (invData.hf_galpao && invData.hf_galpao.length > 0) {
                    galpaoBody.innerHTML = invData.hf_galpao.map(f => <tr><td></td><td> MB</td></tr>).join('');
                } else {
                    galpaoBody.innerHTML = '<tr><td colspan="2" class="empty-state">Galpão Vazio. Faça upload dos videos.</td></tr>';
                }
                const resOracle = await fetch(API_BASE + '/oracle-status', { headers: { 'Authorization': authHeader } });
                const oracleData = await resOracle.json();
                document.getElementById('oracle-space').innerText = oracleData.oracle_hd_used_gb + ' GB';
                const oracleBody = document.getElementById('oracle-list');
                if (oracleData.current_video !== 'Nenhum') {
                    oracleBody.innerHTML = <tr><td></td><td style="color:var(--success)">Transmitindo</td></tr>;
                } else {
                    oracleBody.innerHTML = '<tr><td colspan="2" class="empty-state">Nenhum video baixado na Oracle.</td></tr>';
                }
            } catch (err) {
                statusBadge.className = 'status-badge offline';
                statusBadge.innerHTML = '⚠️ Erro de Conexão';
                if(err.message.includes('autenticação')) {
                    alert("Acesso negado.");
                    document.getElementById('login-overlay').style.display = 'flex';
                }
            }
        }
    </script>
</body>
</html>
