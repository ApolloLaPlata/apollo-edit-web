<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoBanana Character Studio</title>
    <link rel="stylesheet" href="global_style.css">
    <style>
        body { background: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #66fcf1; text-shadow: 0 0 10px rgba(102, 252, 241, 0.5); }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-top: 30px; }
        .panel { background: #1f2833; border: 1px solid #45a29e; border-radius: 10px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .panel h2 { margin-top: 0; color: #45a29e; }
        textarea { width: 100%; height: 150px; background: #0b0c10; color: #fff; border: 1px solid #45a29e; border-radius: 5px; padding: 10px; box-sizing: border-box; resize: none; font-size: 16px; margin-bottom: 20px; }
        textarea:focus { outline: none; box-shadow: 0 0 5px #66fcf1; }
        button { background: #66fcf1; color: #0b0c10; border: none; padding: 15px; width: 100%; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #45a29e; color: #fff; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        .result-container { min-height: 400px; display: flex; align-items: center; justify-content: center; border: 2px dashed #45a29e; border-radius: 10px; background: #0b0c10; }
        .result-container img { max-width: 100%; max-height: 600px; border-radius: 5px; box-shadow: 0 0 20px rgba(102, 252, 241, 0.3); }
        .loading { color: #66fcf1; font-weight: bold; font-size: 20px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .error { color: #ff4c4c; background: rgba(255, 76, 76, 0.1); padding: 15px; border-radius: 5px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍌 NanoBanana Character Studio</h1>
        <p>Gerador Consistente de Folhas de Personagem (Character Sheets) via HuggingFace Flux</p>
        
        <div class="grid">
            <!-- Controle -->
            <div class="panel">
                <h2>Prompt do Personagem</h2>
                <p style="font-size: 12px; color: #888;">Descreva apenas o personagem (ex: Uma garota cyberpunk com cabelo rosa neon e jaqueta de couro).</p>
                <textarea id="promptInput" placeholder="Digite a descrição aqui..."></textarea>
                
                <button id="generateBtn" onclick="generateCharacter()">Gerar Folha (Character Sheet)</button>
                
                <div id="errorMsg" class="error"></div>
            </div>
            
            <!-- Resultado -->
            <div class="panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h2 style="margin: 0;">Resultado (Canvas)</h2>
                    <a id="downloadLnk" style="display:none; color: #66fcf1; text-decoration: none; font-weight: bold;" href="#" download="character-sheet.jpg">↓ Baixar</a>
                </div>
                
                <div class="result-container" id="resultContainer">
                    <span style="color: #555;">Nenhum personagem gerado ainda.</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generateCharacter() {
            const prompt = document.getElementById('promptInput').value.trim();
            if(!prompt) {
                alert("Por favor, digite a descrição do personagem.");
                return;
            }
            
            const btn = document.getElementById('generateBtn');
            const resultBox = document.getElementById('resultContainer');
            const errorBox = document.getElementById('errorMsg');
            const dlLink = document.getElementById('downloadLnk');
            
            btn.disabled = true;
            btn.innerText = "🍌 Acionando Frota NanoBanana...";
            errorBox.style.display = "none";
            dlLink.style.display = "none";
            
            resultBox.innerHTML = '<span class="loading">Infiltrando no HuggingFace... (Pode levar até 45s)</span>';
            
            try {
                const response = await fetch('http://localhost:8000/api/nanobanana/generate-sheet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        account_id: 'v5_account_1', 
                        character_prompt: prompt 
                    })
                });
                
                const data = await response.json();
                
                if(!response.ok) throw new Error(data.detail || "Erro desconhecido na API.");
                
                if(data.status === "success" && data.image_url) {
                    resultBox.innerHTML = '<img src="' + data.image_url + '" alt="Character Sheet" />';
                    dlLink.href = data.image_url;
                    dlLink.style.display = "block";
                } else {
                    throw new Error("Falha ao capturar imagem da Frota.");
                }
                
            } catch(e) {
                resultBox.innerHTML = '<span style="color: #555;">Falha na geração.</span>';
                errorBox.innerText = e.message;
                errorBox.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.innerText = "Gerar Folha (Character Sheet)";
            }
        }
    </script>
</body>
</html>
