<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Chat Lab (Universal API)</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --text-color: #e5e7eb;
            --accent: #3b82f6;
            --border: #1f2937;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .messages {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
        }
        .user-msg {
            background-color: var(--accent);
            align-self: flex-end;
        }
        .ai-msg {
            background-color: var(--border);
            align-self: flex-start;
            white-space: pre-wrap;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input, select {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: white;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2563eb;
        }
        button.mic-btn {
            background-color: #10b981;
            padding: 12px;
        }
        button.mic-btn.recording {
            background-color: #ef4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        label {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: -10px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="margin-top: 0; color: #60a5fa;">Apollo Swarm Config</h2>
        
        <label>Lightning AI Keys (Pool Direto)</label>
        <input type="password" id="apiKey" value="sk-lit-.........................." readonly>

        <label>Modelo (A Mágica acontece aqui)</label>
        <select id="modelSelect">
            <option value="nvidia-nemotron-3-ultra-550b-a55b">NVIDIA Nemotron 3 Ultra 550B (O Gratuito)</option>
            <option value="openai/gpt-5.5-2026-04-23">GPT-5.5 (O Caro)</option>
            <option value="anthropic/claude-opus-4-8">Claude Opus 4.8</option>
            <option value="google/gemini-3.5-flash">Gemini 3.5 Flash</option>
            <option value="nvidia-nemotron-omni-30b">Nemotron Omni 30B (Barato)</option>
        </select>

        <label>System Prompt (A Alma do Roteirista)</label>
        <input type="text" id="sysPrompt" value="Você é um roteirista cínico de suspense. Responda de forma sombria e profissional.">
        
        <label>Voz (TTS)</label>
        <div style="display: flex; gap: 5px; align-items: center; margin-top: 5px;">
            <input type="checkbox" id="voiceToggle" checked style="width: auto;"> Ativar Voz da IA
        </div>

        <label style="margin-top: 20px; color: #fbbf24;">Painel de Logs (Debug)</label>
        <div id="debugLogs" style="flex: 1; background: #111827; border-radius: 6px; padding: 10px; font-size: 0.75rem; color: #a7f3d0; overflow-y: auto; font-family: monospace; border: 1px solid #374151; min-height: 150px; word-break: break-all;">
            > Monitoramento ativo...
        </div>

        <div style="margin-top: 10px;">
            <p style="font-size: 0.8rem; color: #9ca3af;">Isso usa o endpoint universal: <br><i>/v1/chat/completions</i></p>
        </div>
    </div>

    <div class="chat-area">
        <div class="messages" id="chatBox">
            <div class="message ai-msg">Sistemas online. Selecione o modelo à esquerda e envie seu comando ou use o microfone.</div>
        </div>
        <div class="input-area">
            <button onclick="toggleRecording()" id="micBtn" class="mic-btn">🎤</button>
            <input type="text" id="userInput" placeholder="Digite sua mensagem para a IA ou fale..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" id="sendBtn">Enviar</button>
        </div>
    </div>

    <script>
        function addLog(message, type="info") {
            const logsBox = document.getElementById('debugLogs');
            if(!logsBox) return;
            const time = new Date().toLocaleTimeString();
            let color = "#a7f3d0";
            if (type === "error") color = "#fca5a5";
            if (type === "warn") color = "#fcd34d";
            logsBox.innerHTML += `<div style="color: ${color}; margin-bottom: 4px;">[${time}] ${message}</div>`;
            logsBox.scrollTop = logsBox.scrollHeight;
        }

        // Configuração de Voz e Transcrição (Web API Nativa)
        let recognition = null;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                addLog(`[STT] Voz capturada: "${transcript}"`, "info");
                document.getElementById('userInput').value = transcript;
                sendMessage(); // Auto-envia após falar
            };

            recognition.onend = function() {
                isRecording = false;
                document.getElementById('micBtn').classList.remove('recording');
            };

            recognition.onerror = function(event) {
                addLog(`[STT Erro] Falha no reconhecimento: ${event.error}`, "error");
                console.error("Erro no reconhecimento de voz:", event.error);
                isRecording = false;
                document.getElementById('micBtn').classList.remove('recording');
            };
        }

        function toggleRecording() {
            if (!recognition) {
                alert("Seu navegador não suporta a Web Speech API. Use o Chrome ou Edge.");
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                // Parar qualquer voz que estiver tocando antes de ouvir
                window.speechSynthesis.cancel();
                addLog(`[STT] Iniciando escuta nativa do microfone...`, "warn");
                recognition.start();
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
            }
        }

        function speakText(text) {
            const voiceToggle = document.getElementById('voiceToggle').checked;
            if (!voiceToggle) return;
            
            // Cancela áudio atual
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.0;
            utterance.pitch = 0.9;
            
            // Tenta pegar uma voz PT-BR decente (se houver)
            const voices = window.speechSynthesis.getVoices();
            const ptVoice = voices.find(v => v.lang.includes('pt-BR'));
            if(ptVoice) {
                utterance.voice = ptVoice;
                addLog(`[TTS] Iniciando síntese vocal com a voz: ${ptVoice.name}`, "info");
            } else {
                addLog(`[TTS] Aviso: Nenhuma voz PT-BR local encontrada.`, "warn");
            }

            window.speechSynthesis.speak(utterance);
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const sendBtn = document.getElementById('sendBtn');
            // Pool de Chaves Lightning AI (Fallback/Round-Robin direto do Client)
            const lightningKeys = [
                "sk-lit-8d641291-d92e-4469-8465-4a74d1c28a5d",
                "sk-lit-9a87a4ac-9326-4242-bf00-f5e8cd8641be",
                "sk-lit-de1aaa27-2e2c-489e-9d1d-90b9127eb398",
                "sk-lit-baf54912-3c66-4e6d-88cf-00b93868c9a0"
            ];
            const apiKey = lightningKeys[Math.floor(Math.random() * lightningKeys.length)];
            const model = document.getElementById('modelSelect').value;
            const sysPrompt = document.getElementById('sysPrompt').value;
            
            const text = input.value.trim();
            if(!text) return;

            // Adiciona mensagem do usuario
            chatBox.innerHTML += `<div class="message user-msg">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Prepara UI de carregamento
            sendBtn.disabled = true;
            sendBtn.innerText = 'Processando...';

            const startTime = performance.now();
            addLog(`[LLM] Enviando req direta para: ${model} usando Chave: ...${apiKey.slice(-5)}`, "warn");

            try {
                // Conexão Direta e Nativa com a Lightning AI (Proxy Removido)
                const response = await fetch('https://lightning.ai/api/v1/chat/completions', {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: "system", content: sysPrompt },
                            { role: "user", content: text }
                        ]
                    })
                });

                if(!response.ok) {
                    const errBody = await response.text();
                    addLog(`[LLM Erro] Resposta da API falhou: ${response.status} - ${errBody}`, "error");
                    throw new Error(`Erro na API: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                const aiText = data.choices[0].message.content;
                const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                
                addLog(`[LLM] Resposta recebida com sucesso em ${duration} segundos.`, "info");

                // Adiciona resposta da IA
                chatBox.innerHTML += `<div class="message ai-msg">${aiText}</div>`;
                
                // Sintetiza Voz
                speakText(aiText);

            } catch (error) {
                addLog(`[Try/Catch Erro Fatal]: ${error.message}`, "error");
                chatBox.innerHTML += `<div class="message ai-msg" style="color: #ef4444;">Erro de Conexão: Ocorreu um problema ao conectar com a Lightning AI via Proxy.<br>Detalhe: ${error.message}</div>`;
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'Enviar';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
        
        // Garante que as vozes sejam carregadas no Chrome
        window.speechSynthesis.onvoiceschanged = function() {
            window.speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
