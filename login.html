<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V5 APOLLO - Acesso Restrito</title>
    <link rel="icon" href="favicon.png" type="image/png">
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #030406;
            --text-main: #FFFFFF;
            --text-muted: #8B9BB4;
            --accent-cyan: #00E5FF;
            --accent-orange: #FF4500;
            --glass-bg: rgba(15, 20, 35, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Ambient Glow */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.05) 0%, rgba(3, 4, 6, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .login-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }
        .logo span { color: var(--accent-cyan); }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        .toggle-link {
            display: block;
            margin-top: 1.5rem;
            color: var(--accent-cyan);
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .toggle-link:hover { color: #fff; }

        #auth-error {
            background: rgba(255, 69, 0, 0.1);
            border: 1px solid var(--accent-orange);
            color: var(--accent-orange);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        #profile-selection {
            display: none;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    
    <div class="login-card">
        <div class="logo">V5 <span>APOLLO</span></div>
        <div class="subtitle" id="form-subtitle">Autenticação do Comandante</div>

        <div id="auth-error">Erro ao autenticar.</div>

        <div class="input-group">
            <label>Identificação (Email)</label>
            <input type="email" id="email" placeholder="comandante@v5apollo.com">
        </div>

        <div class="input-group">
            <label>Código de Acesso (Senha)</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <div class="input-group" id="profile-selection">
            <label>Modo de Operação</label>
            <select id="user-profile-mode">
                <option value="cloud">Nuvem (V5 Apollo API)</option>
                <option value="local">Local (Processamento Isolado)</option>
            </select>
        </div>

        <button class="btn-primary" id="btn-submit" onclick="handleAuth()">Iniciar Ignição</button>
        
        <a class="toggle-link" id="toggle-mode" onclick="toggleMode()">Solicitar novo acesso (Criar Conta)</a>
    </div>

    <!-- Scripts do Sistema -->
    <script src="laplata_db.js"></script>
    <script src="laplata_settings.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            
            const subEl = document.getElementById('form-subtitle');
            const btnEl = document.getElementById('btn-submit');
            const toggleEl = document.getElementById('toggle-mode');
            const profileSelEl = document.getElementById('profile-selection');
            
            if (isLoginMode) {
                subEl.innerText = "Autenticação do Comandante";
                btnEl.innerText = "Iniciar Ignição";
                toggleEl.innerText = "Solicitar novo acesso (Criar Conta)";
                profileSelEl.style.display = 'none';
            } else {
                subEl.innerText = "Registro de Novo Explorador";
                btnEl.innerText = "Registrar Credenciais";
                toggleEl.innerText = "Já possui acesso? Retornar";
                profileSelEl.style.display = 'block';
            }
            
            document.getElementById('auth-error').style.display = 'none';
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('auth-error');
            errorDiv.style.display = 'none';

            if (!email || !password) {
                errorDiv.innerText = "Preencha todas as credenciais.";
                errorDiv.style.display = 'block';
                return;
            }

            // Fallback de Autenticacao Direta para Mock se supabase nǜo estiver configurado
            if (typeof supabase === 'undefined' || !supabase.auth) {
                errorDiv.innerText = "[Modo Offline] Logando mock na interface.";
                errorDiv.style.display = 'block';
                errorDiv.style.color = '#00E5FF';
                errorDiv.style.borderColor = '#00E5FF';
                errorDiv.style.background = 'rgba(0,229,255,0.1)';
                
                setTimeout(() => {
                    window.location.href = 'apollo_os.html';
                }, 1000);
                return;
            }

            if (isLoginMode) {
                if(!localStorage.getItem('apollo_user_mode')) {
                    localStorage.setItem('apollo_user_mode', 'cloud');
                }

                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    errorDiv.innerText = error.message;
                    errorDiv.style.display = 'block';
                } else {
                    window.location.href = 'apollo_os.html';
                }
            } else {
                const modeSelect = document.getElementById('user-profile-mode').value;
                localStorage.setItem('apollo_user_mode', modeSelect);

                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    errorDiv.innerText = error.message;
                    errorDiv.style.display = 'block';
                } else {
                    alert('Credenciais registradas! Modo ' + (modeSelect === 'cloud' ? 'Nuvem' : 'Local') + ' ativado.');
                    window.location.href = 'apollo_os.html';
                }
            }
        }
    </script>
</body>
</html>
