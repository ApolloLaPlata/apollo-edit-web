<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Apollo Catcher</title>
  <style>
    body {
      width: 350px;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      overflow: hidden;
    }
    
    .glass-container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 900;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1::before {
      content: '';
      display: block;
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
      color: white;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
      margin-top: 5px;
    }

    button:hover {
      background: #0ea5e9;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
    }

    button:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #status {
      margin-top: 15px;
      font-size: 12px;
      text-align: center;
      min-height: 15px;
      font-weight: 600;
    }

    .success { color: #34d399; }
    .error { color: #f87171; }
    
    .glow-orb {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(56,189,248,0.2) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="glow-orb"></div>
  <div class="glass-container">
    <h1>Apollo Catcher</h1>
    
    <div class="form-group">
      <label>Target Domain</label>
      <input type="text" id="domain" placeholder="Ex: localhost:3000" value="localhost:3000">
    </div>

    <div class="form-group">
      <label>Persona (Ghostwriter)</label>
      <select id="persona">
        <option value="tech">Especialista Tech (Profundo)</option>
        <option value="gossip">Fofoca / Sensacionalista</option>
        <option value="crypto">Analista Cripto (Urgente)</option>
        <option value="default">Jornalista Padrão</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>API Key (Ingestion)</label>
      <input type="password" id="apiKey" placeholder="APOLLO_MASTER_KEY">
    </div>

    <button id="captureBtn">Capturar e Enviar</button>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
