# ==========================================
# CONFIGURAÇÃO NGINX - AUTO-BLOG CMS
# ==========================================
# 1. Copie o conteúdo abaixo.
# 2. Na sua Oracle VPS, crie/edite o arquivo usando: sudo nano /etc/nginx/sites-available/default
# 3. Cole este conteúdo, salve, e rode: sudo systemctl restart nginx
# 4. Certifique-se de instalar os certificados SSL depois usando o Certbot (LetsEncrypt).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # O server_name recebe um coringa (_) ou todos os domínios listados
    # ex: server_name darktrapradio.com filosofiadocodigo.com macacodriver.com;
    server_name _;

    location / {
        # Encaminha o tráfego da porta 80 para o servidor local Next.js na porta 3000
        proxy_pass http://localhost:3000;
        
        # Repassa os cabeçalhos originais (Crucial para o nosso Middleware interceptar o host dinâmico!)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Suporte a WebSockets (Útil se houver live-reloading ou painel admin em tempo real)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
